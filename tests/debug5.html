<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>debug5</title>
<style>body{background:#111;color:#ddd;font:12px ui-monospace,monospace;padding:12px}canvas{border:1px solid #444;max-width:100%}pre{white-space:pre}</style>
</head><body>
<canvas id="c"></canvas>
<pre id="out"></pre>
<script type="module">
import { prepare, grayFromRGBA, project, solveHomography, houghLines } from '../js/vision.js';
import { renderScene, makePose } from './scene.js';

const qp = new URLSearchParams(location.search);
const W = +(qp.get('w') || 640), H = +(qp.get('h') || 360);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });
const out = document.getElementById('out');
const L = [];
const log = (s = '') => { L.push(s); out.textContent = L.join('\n'); };
const fmt = q => q.map(p => p.map(v => v.toFixed(1)).join(',')).join('  ');

function sampleBilinear(src, w, h, x, y) {
  if (!(x >= 0 && y >= 0 && x <= w - 1 && y <= h - 1)) return null;
  const x0 = x | 0, y0 = y | 0;
  const x1 = x0 < w - 1 ? x0 + 1 : x0, y1 = y0 < h - 1 ? y0 + 1 : y0;
  const fx = x - x0, fy = y - y0;
  const a = src[y0 * w + x0], b = src[y0 * w + x1], c = src[y1 * w + x0], d = src[y1 * w + x1];
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}

/** cell colours from corner samples (pieces live in the middle) */
function cellColors(gray, w, h, Hm, off = 0.18) {
  const pts = [[off, off], [1 - off, off], [1 - off, 1 - off], [off, 1 - off]];
  const vals = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const v = [];
    for (const [dx, dy] of pts) {
      const p = project(Hm, f + dx, r + dy);
      const s = p ? sampleBilinear(gray, w, h, p[0], p[1]) : null;
      if (s !== null) v.push(s);
    }
    v.sort((a, b) => a - b);
    vals.push(v.length ? (v.length === 4 ? (v[1] + v[2]) / 2 : v[v.length >> 1]) : null);
  }
  return vals;
}

function colorScore(gray, w, h, quad) {
  const Hm = solveHomography([[0, 0], [8, 0], [8, 8], [0, 8]], quad);
  if (!Hm) return null;
  const c = cellColors(gray, w, h, Hm);
  if (c.some(v => v === null)) return null;
  const A = [], B = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) (((f + r) & 1) ? B : A).push(c[r * 8 + f]);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); };
  const mA = mean(A), mB = mean(B);
  const sA = sd(A), sB = sd(B);
  return { sep: Math.abs(mA - mB), sA, sB, score: Math.abs(mA - mB) / (1 + sA + sB), mA, mB };
}

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const quad = makePose(W, H, { tilt: +(qp.get('tilt') || 0.2), size: Math.min(W, H) * +(qp.get('size') || 0.8), cx: W * 0.45, cy: H * 0.48 });
renderScene(ctx, { w: W, h: H, fen: START, quad, border: 0, light: 0, noise: 10, clutter: 0, seed: 1 });
const rgba = ctx.getImageData(0, 0, W, H).data;
const gray = grayFromRGBA(rgba, W, H);
const prep = prepare(gray, W, H);

log('GT : ' + fmt(quad));
let s = colorScore(gray, W, H, quad);
log(`     colorScore=${s.score.toFixed(2)} sep=${s.sep.toFixed(0)} sdA=${s.sA.toFixed(1)} sdB=${s.sB.toFixed(1)}`);

// how does colorScore behave as we slide the quad? (should peak at 0)
log('\nslide dy / scale sweep of colour score:');
for (const dy of [-4, -2, -1, 0, 1, 2, 4]) {
  const q = quad.map(([x, y]) => [x, y + dy]);
  const r = colorScore(gray, W, H, q);
  log(`  dy=${String(dy).padStart(4)}  score=${r.score.toFixed(2)} sep=${r.sep.toFixed(0)} sd=${(r.sA + r.sB).toFixed(0)}`);
}
const cx = quad.reduce((a, p) => a + p[0], 0) / 4, cy = quad.reduce((a, p) => a + p[1], 0) / 4;
for (const k of [0.96, 0.98, 0.99, 1, 1.01, 1.02, 1.04]) {
  const q = quad.map(([x, y]) => [cx + (x - cx) * k, cy + (y - cy) * k]);
  const r = colorScore(gray, W, H, q);
  log(`  scale=${k.toFixed(2)} score=${r.score.toFixed(2)} sep=${r.sep.toFixed(0)} sd=${(r.sA + r.sB).toFixed(0)}`);
}

// hough lines: are the internal grid lines actually detected?
const ls = houghLines(prep.mag, W, H, 20);
log(`\nhough: ${ls.length} lines, top votes=${ls[0]?.votes.toFixed(0)}`);
log(ls.map(l => `${l.theta.toFixed(0)}@${l.rho.toFixed(0)}:${(l.votes / 1000).toFixed(0)}k`).join('  '));

window.__done = true;
</script></body></html>
