<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>debug9 · descriptor diffs</title>
<style>body{background:#111;color:#ddd;font:12px ui-monospace,monospace;padding:12px}canvas{border:1px solid #444}pre{white-space:pre}</style>
</head><body>
<canvas id="c"></canvas>
<pre id="out"></pre>
<script type="module">
import { Chess } from '../vendor/chess.js';
import { BoardTracker, describeBoard, squareDiff, median } from '../js/vision.js';
import { renderScene, makePose } from './scene.js';
import { indexSquare } from '../js/track.js';

const qp = new URLSearchParams(location.search);
const W = +(qp.get('w') || 640), H = +(qp.get('h') || 360);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });
const out = document.getElementById('out');
const L = [];
const log = (s = '') => { L.push(s); out.textContent = L.join('\n'); };

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const quad = makePose(W, H, { tilt: 0.26, size: Math.min(W, H) * 0.8 });
const game = new Chess();
const tracker = new BoardTracker({ side: 'w' });

const shot = () => { const p = tracker.update(ctx.getImageData(0, 0, W, H).data, W, H); return p; };

renderScene(ctx, { w: W, h: H, fen: game.fen(), quad, border: 0.02, light: 0.04, noise: 9, seed: 3 });
let res = shot();
let base = describeBoard(res.prepared, W, H, res.H);
log(`lock score=${res.score.toFixed(1)} motion=${res.motion.toFixed(1)}`);

for (const san of (qp.get('moves') || 'e4,c5,Nf3,d6,d4').split(',')) {
  const want = game.move(san);
  renderScene(ctx, { w: W, h: H, fen: game.fen(), quad, border: 0.02, light: 0.04, noise: 9 + Math.random() * 3, seed: 3 + Math.random() * 1000 });
  for (let f = 0; f < 3; f++) {
    res = shot();
    const desc = res.H ? describeBoard(res.prepared, W, H, res.H) : null;
    const d = desc ? squareDiff(desc, base) : null;
    const wantSq = new Set([want.from, want.to].map((s) => indexSquare((Number(s[1]) - 1) * 8 + 'abcdefgh'.indexOf(s[0]))));
    if (f === 2 && d) {
      const order = [...d].map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
      log(`\n${san} want=${[...wantSq].join(',')} motion=${res.motion.toFixed(1)} score=${res.score.toFixed(1)} med=${median(d).toFixed(1)}`);
      log('  top: ' + order.slice(0, 12).map(([v, i]) => `${indexSquare(i)}=${v.toFixed(0)}${wantSq.has(indexSquare(i)) ? '*' : ''}`).join(' '));
      log('  want diffs: ' + [...wantSq].map((s) => `${s}=${d[(Number(s[1]) - 1) * 8 + 'abcdefgh'.indexOf(s[0])].toFixed(0)}`).join(' '));
    }
  }
  base = describeBoard(res.prepared, W, H, res.H);
}
window.__done = true;
</script></body></html>
