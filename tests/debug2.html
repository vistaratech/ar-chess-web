<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>debug2</title>
<style>body{background:#111;color:#ddd;font:12px ui-monospace,monospace;padding:12px}canvas{border:1px solid #444}pre{white-space:pre}</style>
</head><body>
<canvas id="c" width="480" height="270"></canvas>
<pre id="out"></pre>
<script type="module">
import { prepare, grayFromRGBA, scoreQuad, project, solveHomography } from '../js/vision.js';
import { renderScene, makePose } from './scene.js';

const W = 480, H = 270;
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
const out = document.getElementById('out');
const lines = [];
const log = (s = '') => { lines.push(s); out.textContent = lines.join('\n'); };

function sampleBilinear(src, w, h, x, y) {
  if (!(x >= 0 && y >= 0 && x <= w - 1 && y <= h - 1)) return null;
  const x0 = x | 0, y0 = y | 0;
  const x1 = x0 < w - 1 ? x0 + 1 : x0, y1 = y0 < h - 1 ? y0 + 1 : y0;
  const fx = x - x0, fy = y - y0;
  const a = src[y0 * w + x0], b = src[y0 * w + x1], c = src[y1 * w + x0], d = src[y1 * w + x1];
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}

const SRC = [[0, 0], [8, 0], [8, 8], [0, 8]];

function metrics(prep, w, h, quad) {
  const Hm = solveHomography(SRC, quad);
  if (!Hm) return null;
  const { gray, mag } = prep;

  // (a) pair-median contrast between adjacent cells
  const cell = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const p = project(Hm, f + 0.5, r + 0.5);
    cell.push(p ? sampleBilinear(gray, w, h, p[0], p[1]) : null);
  }
  const diffs = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 7; f++) {
    const a = cell[r * 8 + f], b = cell[r * 8 + f + 1];
    if (a !== null && b !== null) diffs.push(Math.abs(a - b));
  }
  diffs.sort((x, y) => x - y);
  const pairMedian = diffs[diffs.length >> 1];

  // (b) phase alignment: gradient on internal boundaries vs cell centres
  let onLine = 0, onLineN = 0, offLine = 0, offLineN = 0;
  for (let k = 1; k < 8; k++) {
    for (const vert of [true, false]) {
      for (let t = 0.06; t <= 0.94; t += 0.11) {
        const p = vert ? project(Hm, k, t * 8) : project(Hm, t * 8, k);
        const q1 = vert ? project(Hm, k + 0.5, t * 8) : project(Hm, t * 8, k + 0.5);
        const q2 = vert ? project(Hm, k - 0.5, t * 8) : project(Hm, t * 8, k - 0.5);
        const v = p && sampleBilinear(mag, w, h, p[0], p[1]);
        if (v !== null) { onLine += v; onLineN++; }
        for (const q of [q1, q2]) {
          const v2 = q && sampleBilinear(mag, w, h, q[0], q[1]);
          if (v2 !== null) { offLine += v2; offLineN++; }
        }
      }
    }
  }
  const align = (onLine / Math.max(1, onLineN)) / (0.001 + offLine / Math.max(1, offLineN));

  // (c) outer edge strength vs internal
  let edge = 0, edgeN = 0;
  for (let i = 0; i < 4; i++) {
    const a = quad[i], b = quad[(i + 1) % 4];
    for (let t = 0.05; t <= 0.95; t += 0.1) {
      const v = sampleBilinear(mag, w, h, a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t);
      if (v !== null) { edge += v; edgeN++; }
    }
  }
  const edgeMean = edgeN ? edge / edgeN : 0;
  return { pairMedian, align, edgeMean, onLine: onLine / Math.max(1, onLineN) };
}

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

for (const [name, border] of [['no border', 0], ['3% border', 0.03], ['6% border', 0.06]]) {
  const quad = makePose(W, H, { tilt: 0.3, size: Math.min(W, H) * 0.74 });
  renderScene(ctx, { w: W, h: H, fen: START, quad, border, light: 0.04, noise: 6, seed: 7 });
  const prep = prepare(grayFromRGBA(ctx.getImageData(0, 0, W, H).data, W, H), W, H);
  log(`\n--- ${name} ---`);
  const cx = quad.reduce((a, p) => a + p[0], 0) / 4;
  const cy = quad.reduce((a, p) => a + p[1], 0) / 4;
  log('scale  pairMed  align  onLine  edgeMean  score(orig)');
  for (let k = 0.88; k <= 1.101; k += 0.02) {
    const q = quad.map(([x, y]) => [cx + (x - cx) * k, cy + (y - cy) * k]);
    const m = metrics(prep, W, H, q);
    const sc = scoreQuad(prep, W, H, q);
    log(`${k.toFixed(2)}  ${m.pairMedian.toFixed(1).padStart(6)}  ${m.align.toFixed(2).padStart(5)}  ${m.onLine.toFixed(0).padStart(5)}  ${m.edgeMean.toFixed(0).padStart(6)}  ${sc ? sc.score.toFixed(2) : '-'}`);
  }
}

window.__done = true;
</script></body></html>
