<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>debug6</title>
<style>body{background:#111;color:#ddd;font:12px ui-monospace,monospace;padding:12px}canvas{border:1px solid #444;max-width:100%}pre{white-space:pre}</style>
</head><body>
<canvas id="c"></canvas>
<pre id="out"></pre>
<script type="module">
import { prepare, grayFromRGBA, scoreQuad, candidateQuads, snapQuad, detectQuad } from '../js/vision.js';
import { renderScene, makePose } from './scene.js';

const qp = new URLSearchParams(location.search);
const W = +(qp.get('w') || 640), H = +(qp.get('h') || 360);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });
const out = document.getElementById('out');
const L = [];
const log = (s = '') => { L.push(s); out.textContent = L.join('\n'); };
const fmt = q => q.map(p => p.map(v => v.toFixed(1)).join(',')).join('  ');
const shift = (a, b) => { let best = Infinity; for (let k = 0; k < 4; k++) { let s = 0; for (let i = 0; i < 4; i++) { const p = a[i], q = b[(i + k) % 4]; s += Math.hypot(p[0] - q[0], p[1] - q[1]); } best = Math.min(best, s / 4); } return best; };

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const quad = makePose(W, H, { tilt: +(qp.get('tilt') || 0.2), size: Math.min(W, H) * +(qp.get('size') || 0.8), cx: W * 0.45, cy: H * 0.48 });
renderScene(ctx, { w: W, h: H, fen: START, quad, border: +(qp.get('border') || 0), light: 0.04, noise: 10, clutter: 0, seed: 1 });
const prep = prepare(grayFromRGBA(ctx.getImageData(0, 0, W, H).data, W, H), W, H);

const gt = scoreQuad(prep, W, H, quad);
log('GT  : ' + fmt(quad));
log(`      score=${gt.score.toFixed(1)} sep=${gt.sep.toFixed(0)} sd=${(gt.sdA + gt.sdB).toFixed(1)}`);

const t0 = performance.now();
const cands = candidateQuads(prep, W, H);
const tCand = performance.now() - t0;
log(`\ncandidates=${cands.length} (enumeration ${tCand.toFixed(0)}ms)`);

const tried = [];
let shown = 0;
const t1 = performance.now();
for (const c of cands) {
  if (tried.some((t) => shift(t, c.quad) < W * 0.03)) continue;
  tried.push(c.quad);
  const f1 = snapQuad(prep.mag, W, H, c.quad, 10);
  const f2 = f1 ? snapQuad(prep.mag, W, H, f1, 3) : null;
  const q = f2 || f1 || c.quad;
  const sc = scoreQuad(prep, W, H, q);
  if (sc) {
    log(`cand area=${(c.area / (W * H) * 100).toFixed(1)}% rawErr=${shift(c.quad, quad).toFixed(1)}px fit=${f1 ? (f2 ? '2pass' : '1pass') : 'FAIL'} score=${sc.score.toFixed(1)} sep=${sc.sep.toFixed(0)} sd=${(sc.sdA + sc.sdB).toFixed(1)} errGT=${shift(q, quad).toFixed(1)}px`);
  } else {
    log(`cand area=${(c.area / (W * H) * 100).toFixed(1)}% fit=${f1 ? 'ok' : 'FAIL'} score=null`);
  }
  if (++shown >= 12) break;
}
log(`scan ${(performance.now() - t1).toFixed(0)}ms`);

const d = detectQuad(prep, W, H);
log('\ndetectQuad -> ' + (d ? fmt(d.quad) + ` score=${d.score.toFixed(1)} errGT=${shift(d.quad, quad).toFixed(1)}px` : 'none'));
window.__done = true;
</script></body></html>
