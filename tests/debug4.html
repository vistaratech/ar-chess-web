<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>debug4</title>
<style>body{background:#111;color:#ddd;font:12px ui-monospace,monospace;padding:12px}canvas{border:1px solid #444;max-width:100%}pre{white-space:pre}</style>
</head><body>
<canvas id="c"></canvas>
<pre id="out"></pre>
<script type="module">
import { prepare, grayFromRGBA, scoreQuad, detectQuad, project, solveHomography } from '../js/vision.js';
import { renderScene, makePose } from './scene.js';

const qp = new URLSearchParams(location.search);
const W = +(qp.get('w') || 640), H = +(qp.get('h') || 360);
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });
const out = document.getElementById('out');
const lines = [];
const log = (s = '') => { lines.push(s); out.textContent = lines.join('\n'); };
const fmt = q => q.map(p => p.map(v => v.toFixed(1)).join(',')).join('  ');

function sampleBilinear(src, w, h, x, y) {
  if (!(x >= 0 && y >= 0 && x <= w - 1 && y <= h - 1)) return null;
  const x0 = x | 0, y0 = y | 0;
  const x1 = x0 < w - 1 ? x0 + 1 : x0, y1 = y0 < h - 1 ? y0 + 1 : y0;
  const fx = x - x0, fy = y - y0;
  const a = src[y0 * w + x0], b = src[y0 * w + x1], c = src[y1 * w + x0], d = src[y1 * w + x1];
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}

function snapReport(prep, w, h, quad, label) {
  const Hm = solveHomography([[0, 0], [8, 0], [8, 8], [0, 8]], quad);
  let hits = 0, total = 0;
  const rows = [];
  for (let k = 1; k < 8; k++) {
    let row = `k=${k}: `;
    for (const vert of [true, false]) {
      let hh = 0, n = 0, offs = [];
      for (let t = 0.07; t <= 0.93; t += 0.11) {
        const p = vert ? project(Hm, k, t * 8) : project(Hm, t * 8, k);
        const qa = vert ? project(Hm, k + 0.3, t * 8) : project(Hm, t * 8, k + 0.3);
        if (!p || !qa) continue;
        let bestV = -1, bestO = 0;
        for (let o = -0.3; o <= 0.301; o += 0.05) {
          const v = sampleBilinear(prep.mag, w, h, p[0] + (qa[0] - p[0]) * (o / 0.3), p[1] + (qa[1] - p[1]) * (o / 0.3));
          if (v !== null && v > bestV) { bestV = v; bestO = o; }
        }
        n++; total++;
        if (bestV >= 70 && Math.abs(bestO) <= 0.16) { hh++; hits++; }
        offs.push((bestO * 100).toFixed(0) + '@' + bestV.toFixed(0));
      }
      row += `${vert ? 'V' : 'H'}${hh}/${n} [${offs.slice(0, 4).join(' ')}]  `;
    }
    rows.push(row);
  }
  const sc = scoreQuad(prep, w, h, quad);
  log(`${label}: score=${sc.score.toFixed(1)} consistency=${(hits / total).toFixed(2)} sides=${sc.sides.toFixed(0)} contrast=${sc.contrast.toFixed(0)}`);
  for (const r of rows) log('   ' + r);
}

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const quad = makePose(W, H, { tilt: +(qp.get('tilt') || 0.2), size: Math.min(W, H) * +(qp.get('size') || 0.8), cx: W * 0.45, cy: H * 0.48 });
renderScene(ctx, { w: W, h: H, fen: START, quad, border: 0, light: 0, noise: 10, clutter: 0, seed: 1 });
const prep = prepare(grayFromRGBA(ctx.getImageData(0, 0, W, H).data, W, H), W, H);

log('GT: ' + fmt(quad));
snapReport(prep, W, H, quad, 'GT');
const det = detectQuad(prep, W, H);
if (det) {
  log('\ndet: ' + fmt(det.quad) + '  (score ' + det.score.toFixed(1) + ')');
  snapReport(prep, W, H, det.quad, 'DET');
} else log('\ndet: none');
window.__done = true;
</script></body></html>
