<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>debug3</title>
<style>body{background:#111;color:#ddd;font:12px ui-monospace,monospace;padding:12px}canvas{border:1px solid #444}pre{white-space:pre}</style>
</head><body>
<canvas id="c" width="480" height="270"></canvas>
<pre id="out"></pre>
<script type="module">
import { prepare, grayFromRGBA, scoreQuad, detectQuad, refineQuad, houghLines, project } from '../js/vision.js';
import { renderScene, makePose } from './scene.js';

const qp = new URLSearchParams(location.search); const W = +(qp.get("w")||480), H = +(qp.get("h")||270);
const cv = document.getElementById("c"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d", { willReadFrequently: true });
const out = document.getElementById('out');
const lines = [];
const log = (s = '') => { lines.push(s); out.textContent = lines.join('\n'); };
const fmt = q => q.map(p => p.map(v => v.toFixed(1)).join(',')).join('  ');

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const quad = makePose(W, H, { tilt: +(qp.get("tilt")||0.2), size: Math.min(W, H) * +(qp.get("size")||0.66), cx: W * 0.45, cy: H * 0.48 });
renderScene(ctx, { w: W, h: H, fen: START, quad, border: 0, light: 0, noise: 10, clutter: 0, seed: 1 });
const prep = prepare(grayFromRGBA(ctx.getImageData(0, 0, W, H).data, W, H), W, H);

log('GT    : ' + fmt(quad) + '   score=' + scoreQuad(prep, W, H, quad).score.toFixed(1));
const ls = houghLines(prep.mag, W, H, 20);
log(`\nhough lines (${ls.length}):`);
for (const l of ls) log(`  theta=${l.theta.toFixed(0).padStart(3)} rho=${l.rho.toFixed(0).padStart(5)} votes=${l.votes.toFixed(0)}`);

const t1 = performance.now(); const det = detectQuad(prep, W, H); const t2 = performance.now(); const t0b = t1; log('detectQuad ms=' + (t2-t1).toFixed(0));
log('\nraw detect : ' + (det ? fmt(det.quad) + '  score=' + det.score.toFixed(1) : 'none'));
if (det) {
  const a = refineQuad(prep, W, H, det.quad, { inset: true, passes: 3 });
  log('refined    : ' + fmt(a) + '  score=' + scoreQuad(prep, W, H, a).score.toFixed(1));
  const b = refineQuad(prep, W, H, det.quad, { inset: false, passes: 3 });
  log('no-inset   : ' + fmt(b) + '  score=' + scoreQuad(prep, W, H, b).score.toFixed(1));
}

// score landscape around the true quad: move the whole quad vertically
log('\nshift dy:');
for (let dy = -12; dy <= 12; dy += 4) {
  const q = quad.map(([x, y]) => [x, y + dy]);
  const s = scoreQuad(prep, W, H, q) || { score: 0, align: 0, edgeRatio: 0, onMean: 0 };
  log(`  dy=${String(dy).padStart(3)} score=${s.score.toFixed(1)} align=${s.align.toFixed(2)} edgeRatio=${s.edgeRatio.toFixed(2)} onMean=${s.onMean.toFixed(0)}`);
}

window.__done = true;
</script></body></html>
