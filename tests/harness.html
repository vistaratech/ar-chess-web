<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vision harness</title>
<style>
  body { background: #111; color: #ddd; font: 13px/1.45 ui-monospace, monospace; margin: 0; padding: 16px; }
  canvas { display: block; border: 1px solid #444; image-rendering: pixelated; }
  pre { white-space: pre-wrap; }
  .ok { color: #6f6; } .bad { color: #f66; } .warn { color: #fc6; }
</style>
</head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<pre id="out">running…</pre>
<script type="module">
import { Chess } from '../vendor/chess.js';
import {
  BoardTracker, BoardSampler, boardHomography, describeBoard, describeSquares, grayFromRGBA,
  prepare, project, scoreQuad, squareDiff, median,
} from '../js/vision.js';
import { renderScene, makePose } from './scene.js';
import { MoveReader, inferMove, indexSquare } from '../js/track.js';
import { Coach } from '../js/coach.js';

const qp = new URLSearchParams(location.search);
const W = +(qp.get('w') || 480), H = +(qp.get('h') || 270);
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const out = document.getElementById('out');
const lines = [];
const log = (s = '') => { lines.push(s); out.textContent = lines.join('\n'); };

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

function frame() {
  const img = ctx.getImageData(0, 0, W, H);
  return img.data;
}

function quadError(a, b) {
  if (!a || !b) return Infinity;
  // compare as unordered point sets (orientation of the detected quad may differ)
  let best = Infinity;
  for (let shift = 0; shift < 4; shift++) {
    let s = 0;
    for (let i = 0; i < 4; i++) {
      const p = a[i], q = b[(i + shift) % 4];
      s += Math.hypot(p[0] - q[0], p[1] - q[1]);
    }
    best = Math.min(best, s / 4);
  }
  return best;
}

/**
 * Read one frame the way the app does: describe the squares on the anchored
 * sampling grid, push it to the reader, and — while nothing is changing — let
 * the reference follow the board so the grid stays on its squares.
 */
function sample(res, sampler, reader) {
  const desc = sampler.see(res.prepared, W, H, res);
  if (!reader) return { r: null, desc };
  const r = reader.push(desc, { gridMoved: res.gridMoved });
  if (!r.settled && !r.stuck && !r.changed.size && sampler.drift(res) > 0.04) {
    const fresh = sampler.refresh(res.prepared, W, H, res);
    reader.commit(fresh);
    return { r, desc: fresh };
  }
  return { r, desc };
}

/* ------------------------------------------------------------------ */
/* 1. board detection across camera poses                              */
/* ------------------------------------------------------------------ */
log('=== 1. detection ===');
const poses = [];
for (let i = 0; i < 14; i++) {
  poses.push({
    rot: (i % 7) * 0.012 - 0.04,
    tilt: 0.2 + (i % 5) * 0.08,
    skew: ((i % 4) - 1.5) * 0.03,
    size: Math.min(W, H) * (0.66 + (i % 3) * 0.1),
    cx: W * (0.45 + ((i % 3) - 1) * 0.04),
    cy: H * (0.48 + ((i % 4) - 1.5) * 0.015),
    light: (i % 3) * 0.08,
    noise: 10 + (i % 4) * 4,
    clutter: i % 2 ? 2 : 0,
    border: i % 3 === 0 ? 0.03 : 0,
  });
}

let ok = 0, total = 0, worst = 0, ms = 0;
for (const [i, p] of poses.entries()) {
  const quad = makePose(W, H, p);
  renderScene(ctx, { w: W, h: H, fen: START, quad, border: p.border || 0, light: p.light, noise: p.noise, clutter: p.clutter, seed: i + 1 });
  const t0 = performance.now();
  const tracker = new BoardTracker({ side: 'w' });
  const res = tracker.update(frame(), W, H);
  const dt = performance.now() - t0;
  ms += dt;
  const err = quadError(res.quad, quad);
  const rel = err / Math.hypot(quad[1][0] - quad[0][0], quad[1][1] - quad[0][1]);
  total++;
  if (res.quad && rel < 0.06) ok++; else worst = Math.max(worst, rel);
  const gtsc = scoreQuad(prepare(grayFromRGBA(frame(), W, H), W, H), W, H, quad);
  log(`pose ${String(i).padStart(2)} tilt=${p.tilt.toFixed(2)} err=${isFinite(rel) ? (rel * 100).toFixed(1) + '%' : 'none'} ${res.quad && rel < 0.06 ? 'ok' : 'FAIL'} (${dt.toFixed(0)}ms) gtscore=${gtsc ? gtsc.score.toFixed(1) + '/sep' + gtsc.sep.toFixed(0) : '-'} det=${res.score.toFixed(1)}`);
}
log(`detection: ${ok}/${total} within 6% of board width; mean ${(ms / total).toFixed(0)}ms`);

/* ------------------------------------------------------------------ */
/* 2. orientation: a1 must be dark, h1 light, for both sides            */
/* ------------------------------------------------------------------ */
log('\n=== 2. orientation ===');
for (const side of ['w', 'b']) {
  const quad = makePose(W, H, { tilt: 0.3, size: Math.min(W, H) * 0.74 });
  renderScene(ctx, { w: W, h: H, fen: START, quad, border: 0.02, light: 0.05, noise: 8, seed: 7 });
  const rgba = frame();
  const gray = grayFromRGBA(rgba, W, H);
  const tr = new BoardTracker({ side });
  const res = tr.update(rgba, W, H);
  if (!res.H) {
    const gtsc = scoreQuad(prepare(gray, W, H), W, H, quad);
    log(`side ${side}: NO LOCK gt=${gtsc ? gtsc.score.toFixed(2) + '/' + gtsc.trim().toFixed(2) : 'none'}`);
    continue;
  }
  const desc = describeBoard(res.prepared, W, H, res.H);
  const mean = (i) => { let s = 0; for (let k = 0; k < 9; k++) s += desc[i * 9 + k]; return s / 9; };
  const rank1 = Array.from({ length: 8 }, (_, i) => mean(i).toFixed(0)).join(' ');
  const good = mean(0) < mean(7);
  log(`side ${side}: rank1 = ${rank1} -> a1<h1 ${good ? 'ok' : 'WRONG'} (quad err ${quadError(res.quad, quad).toFixed(1)}px)`);
}

/* ---- stability: identical frames must not move the sampling grid       */
log('\n=== 2b. stability (same frame x8) ===');
{
  const quad = makePose(W, H, { tilt: 0.3, size: Math.min(W, H) * 0.74 });
  renderScene(ctx, { w: W, h: H, fen: START, quad, border: 0.02, light: 0.05, noise: 8, seed: 7 });
  const bytes = ctx.getImageData(0, 0, W, H).data;
  const tr = new BoardTracker({ side: 'w' });
  let prev = null;
  for (let i = 0; i < 8; i++) {
    const res = tr.update(bytes, W, H);
    const gray = grayFromRGBA(bytes, W, H);
    const d = res.H ? describeBoard(res.prepared, W, H, res.H) : null;
    if (prev && d) {
      const df = squareDiff(d, prev);
      log(`  frame ${i}: medDiff=${median(df).toFixed(2)} max=${Math.max(...df).toFixed(1)} quadErr=${quadError(res.quad, quad).toFixed(1)}px`);
    }
    prev = d;
  }
}

/* ------------------------------------------------------------------ */
/* 3. full pipeline: play a game and read every move                    */
/* ------------------------------------------------------------------ */
log('\n=== 3. move reading ===');
const moves = ['e4', 'c5', 'Nf3', 'd6', 'd4', 'cxd4', 'Nxd4', 'Nf6', 'Nc3', 'a6', 'Be3', 'e6', 'f3', 'b5', 'Qd2', 'Nbd7', 'g4', 'h6', 'O-O-O', 'Bb7'];
const quad = makePose(W, H, { tilt: 0.26, size: Math.min(W, H) * 0.8 });
const tracker = new BoardTracker({ side: 'w' });
const sampler = new BoardSampler();
const reader = new MoveReader();
const game = new Chess();

renderScene(ctx, { w: W, h: H, fen: game.fen(), quad, border: 0.02, light: 0.04, noise: 9, seed: 3 });
let rgba = frame();
let res = tracker.update(rgba, W, H);
let gray = grayFromRGBA(rgba, W, H);
reader.commit(sampler.see(res.prepared, W, H, res));

let pass = 0;
for (const san of moves) {
  const legal = game.moves({ verbose: true });   // position *before* the move
  const want = game.move(san);
  renderScene(ctx, { w: W, h: H, fen: game.fen(), quad, border: 0.02, light: 0.04, noise: 9 + Math.random() * 3, seed: 3 + moves.indexOf(san) });
  let got = null, note = '';
  const trace = [];
  for (let f = 0; f < 3; f++) {
    rgba = frame();
    res = tracker.update(rgba, W, H);
    gray = grayFromRGBA(rgba, W, H);
    const { r, desc } = res.H ? sample(res, sampler, reader) : { r: null, desc: null };
    if (!desc) { note = 'no board'; continue; }
    trace.push(`f${f}:qs${res.quadShift.toFixed(2)}:mt${res.motion.toFixed(0)}:n${r.changed.size}${r.settled ? 'S' : ''}${r.rebased ? 'R' : ''}`);
    if (!r.settled) continue;
    const inf = inferMove(legal, r.changed);
    if (inf.accepted) {
      got = inf.move;
      reader.commit(desc);
      break;
    }
    note = `changed=${[...r.changed].map(indexSquare).join(',')} best=${inf.best ? inf.best.move.san : '-'} score=${inf.best ? inf.best.score.toFixed(2) : '-'} margin=${isFinite(inf.margin) ? inf.margin.toFixed(2) : 'inf'}`
      + (inf.ambiguous ? ' ambiguous' : '') + ' ' + trace.join(' ');
    reader.commit(desc);
  }
  const okMove = got && got.from === want.from && got.to === want.to;
  if (okMove) pass++;
  log(`${san.padEnd(6)} want=${want.from}${want.to} got=${got ? got.from + got.to : '---'} ${okMove ? 'ok' : 'FAIL ' + (note || trace.join(' '))}`);
}
log(`move reading: ${pass}/${moves.length}`);

/* ------------------------------------------------------------------ */
/* 4. a person's arm lying across the board                            */
/* ------------------------------------------------------------------ */
log('\n=== 4. occlusion (arm across the board) ===');

const ARM = { pts: [[-0.5, 0.6], [2.4, 1.5], [5.4, 2.2], [8.4, 2.6]], width: 2.1 };
const HAND = { pts: [[-0.6, 5.2], [1.8, 6.4], [2.6, 7.6]], width: 2.4 };

// 4a. detection with a hand/forearm entering over one corner
{
  let hit = 0;
  for (let i = 0; i < 6; i++) {
    const p = poses[i];
    const quad = makePose(W, H, p);
    renderScene(ctx, {
      w: W, h: H, fen: START, quad, border: p.border || 0, light: p.light,
      noise: p.noise, clutter: p.clutter, seed: i + 1, occluders: [HAND],
    });
    const tr = new BoardTracker({ side: 'w' });
    const res = tr.update(frame(), W, H);
    const bw = Math.hypot(quad[1][0] - quad[0][0], quad[1][1] - quad[0][1]);
    const rel = quadError(res.quad, quad) / bw;
    if (res.quad && rel < 0.06) hit++;
    log(`  pose ${i}: err=${isFinite(rel) ? (rel * 100).toFixed(1) + '%' : 'none'} score=${res.score.toFixed(1)}/trim=${res.scoreTrim.toFixed(1)} ${res.quad && rel < 0.06 ? 'ok' : 'FAIL'}`);
  }
  log(`  detection with a corner occluded: ${hit}/6`);
}

// 4b. an arm lies across the board *while* the camera pans: the lock must
// survive and the grid must keep following the board (this is the "somebody is
// playing" case — the overlay may not jump or reset)
{
  const q0 = makePose(W, H, { tilt: 0.3, size: Math.min(W, H) * 0.8 });
  const tr = new BoardTracker({ side: 'w' });
  renderScene(ctx, { w: W, h: H, fen: START, quad: q0, border: 0.02, light: 0.04, noise: 8, seed: 20 });
  tr.update(frame(), W, H);
  let worst = 0, lost = 0, shifted = 0;
  for (let k = 1; k <= 18; k++) {
    const q = q0.map(([x, y]) => [x + k * 2.2, y + k * 0.5]);
    renderScene(ctx, {
      w: W, h: H, fen: START, quad: q, border: 0.02, light: 0.04,
      noise: 8, seed: 20 + (k % 3), occluders: [ARM],
    });
    const res = tr.update(frame(), W, H);
    if (!res.quad) { lost++; continue; }
    if (res.quadShift > 0.25) shifted++;
    const bw = Math.hypot(q[1][0] - q[0][0], q[1][1] - q[0][1]);
    const rel = quadError(res.quad, q) / bw;
    worst = Math.max(worst, rel);
  }
  log(`  pan+arm: lost=${lost}/18 followed=${shifted}/18 worst=${(worst * 100).toFixed(1)}%`
    + `${!lost && worst < 0.06 ? ' ok' : ' FAIL'}`);
}

// 4c. a hand over a corner while a move is played elsewhere: the move must be
// read as soon as the hand is gone (the reference must not be thrown away)
{
  const quad = makePose(W, H, { tilt: 0.24, size: Math.min(W, H) * 0.8 });
  const HAND = { pts: [[-0.4, 5.6], [1.6, 6.2], [2.2, 7.4]], width: 2.4 };
  const game = new Chess();
  const tr = new BoardTracker({ side: 'w' });
  const reader = new MoveReader();
  const sampler = new BoardSampler();
  const shot = (fen, occ) => {
    renderScene(ctx, { w: W, h: H, fen, quad, border: 0.02, light: 0.04, noise: 9, seed: 31, occluders: occ });
  };
  const readFrames = (n, occ) => {
    let last = null;
    for (let i = 0; i < n; i++) {
      shot(game.fen(), occ);
      const res = tr.update(frame(), W, H);
      if (!res.H) return null;
      const { r, desc } = sample(res, sampler, reader);
      last = r;
      if (last.settled || last.stuck) return { r: last, desc };
    }
    return { r: last, desc: null };
  };

  shot(game.fen(), null);
  let res = tr.update(frame(), W, H);
  reader.commit(sampler.see(res.prepared, W, H, res));
  const legalBefore = game.moves({ verbose: true });
  const want = game.move('Nf3');
  // hand parks on the board first, then the knight moves underneath it
  const a = readFrames(3, [HAND]);
  const b = readFrames(4, [HAND]);
  const c = readFrames(4, null);
  const inf = c && c.r && c.r.settled ? inferMove(legalBefore, c.r.changed) : { accepted: false };
  const okM = inf.accepted && inf.move.from === want.from && inf.move.to === want.to;
  log(`  move under a hand: parked=${!!(a && a.r && a.r.implausible)} fired-while-covered=${!!(b && b.r && b.r.settled)} read=${okM ? 'ok' : 'FAIL'}`
    + (okM ? '' : ` changed=${c && c.r ? [...c.r.changed].map(indexSquare).join(',') : '-'}`));
}

// 4d. the same, but the hand covers the squares the piece moves through
{
  const quad = makePose(W, H, { tilt: 0.24, size: Math.min(W, H) * 0.8 });
  const HAND = { pts: [[4.2, 0.9], [6.4, 1.3], [7.2, 2.1]], width: 2.6 };
  const game = new Chess();
  const tr = new BoardTracker({ side: 'w' });
  const reader = new MoveReader();
  const sampler = new BoardSampler();
  const shot = (fen, occ) => {
    renderScene(ctx, { w: W, h: H, fen, quad, border: 0.02, light: 0.04, noise: 9, seed: 41, occluders: occ });
  };
  const step = (n, occ) => {
    let last = null;
    for (let i = 0; i < n; i++) {
      shot(game.fen(), occ);
      const res = tr.update(frame(), W, H);
      if (!res.H) return null;
      const { r, desc } = sample(res, sampler, reader);
      last = r;
      if (last.settled || last.stuck) return { r: last, desc };
    }
    return { r: last, desc: null };
  };
  shot(game.fen(), null);
  const r0 = tr.update(frame(), W, H);
  reader.commit(sampler.see(r0.prepared, W, H, r0));
  const legalBefore = game.moves({ verbose: true });
  const want = game.move('Nf3');
  step(3, [HAND]);
  const c = step(5, null);
  const inf = c && c.r && c.r.settled ? inferMove(legalBefore, c.r.changed) : { accepted: false };
  const okM = inf.accepted && inf.move.from === want.from && inf.move.to === want.to;
  log('  move out of a hand: read=' + (okM ? 'ok' : 'FAIL')
    + (okM ? '' : ` changed=${c && c.r ? [...c.r.changed].map(indexSquare).join(',') : '-'}`));
}

/* ------------------------------------------------------------------ */
/* 5. false locks: no board in the frame                               */
/* ------------------------------------------------------------------ */
log('\n=== 5. no board present ===');
let falseLocks = 0;
{
  // A table, a wall, a poster with rectangles, a heap of clutter: the app must
  // not claim a board here. A false lock is worse than no lock — every square
  // would report nonsense moves.
  let seed = 5;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const scenes = [
    (c) => {
      c.fillStyle = '#8a6f52'; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 40; i++) {
        c.fillStyle = `rgba(${60 + rnd() * 90 | 0},${40 + rnd() * 70 | 0},${30 + rnd() * 60 | 0},.5)`;
        c.fillRect(rnd() * W, rnd() * H, 10 + rnd() * 120, 4 + rnd() * 30);
      }
    },
    (c) => {
      c.fillStyle = '#cfcabf'; c.fillRect(0, 0, W, H);
      c.strokeStyle = '#5d5a54'; c.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        const w = 40 + rnd() * 160, h = 30 + rnd() * 90;
        c.strokeRect(rnd() * (W - w), rnd() * (H - h), w, h);
      }
    },
    (c) => {
      c.fillStyle = '#2b2f36'; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 700; i++) {
        c.fillStyle = `rgba(${rnd() * 255 | 0},${rnd() * 255 | 0},${rnd() * 255 | 0},.35)`;
        c.fillRect(rnd() * W, rnd() * H, 2 + rnd() * 20, 2 + rnd() * 20);
      }
    },
    (c) => {
      // a striped rug: parallel lines only, like half a board
      c.fillStyle = '#7a5b3c'; c.fillRect(0, 0, W, H);
      c.fillStyle = '#3d2c1c';
      for (let i = 0; i < 9; i++) c.fillRect(0, i * 30, W, 14);
    },
  ];
  let falseLocksInScene = 0;
  scenes.forEach((draw, i) => {
    draw(ctx);
    const tr = new BoardTracker({ side: 'w' });
    const res = tr.update(frame(), W, H);
    if (res.quad) { falseLocks++; falseLocksInScene++; }
    log(`  scene ${i}: ${res.quad ? 'LOCKED (bad)' : 'no lock'} score=${res.score.toFixed(1)} trim=${res.scoreTrim.toFixed(1)}`);
  });
  log(`  false locks: ${falseLocksInScene}/${scenes.length}`);
}

/* ------------------------------------------------------------------ */
/* 6. board anywhere: the same board in every corner of the frame      */
/* ------------------------------------------------------------------ */
log('\n=== 6. board anywhere ===');
{
  const bbox = (q) => {
    const xs = q.map((p) => p[0]), ys = q.map((p) => p[1]);
    return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
  };
  let ok6 = 0, n6 = 0;
  const fails6 = [];
  for (const size of [0.35, 0.5, 0.72]) {
    for (const rot of [0, 0.4]) {
      const base = { cx: W / 2, cy: H / 2, size: Math.min(W, H) * size, rot, tilt: 0.3 };
      const bb = bbox(makePose(W, H, base));
      const halfW = (bb.x1 - bb.x0) / 2, halfH = (bb.y1 - bb.y0) / 2;
      const offX = (bb.x0 + bb.x1) / 2 - W / 2, offY = (bb.y0 + bb.y1) / 2 - H / 2;
      const m = W * 0.02;
      const loX = halfW + m - offX, hiX = W - halfW - m - offX;
      const loY = halfH + m - offY, hiY = H - halfH - m - offY;
      if (loX > hiX || loY > hiY) continue;
      for (const [px, py] of [[loX, loY], [hiX, loY], [loX, hiY], [hiX, hiY], [(loX + hiX) / 2, (loY + hiY) / 2]]) {
        const quad = makePose(W, H, { ...base, cx: px, cy: py });
        renderScene(ctx, { w: W, h: H, fen: START, quad, border: 0.02, light: 0.05, noise: 8, seed: 11 });
        const tr = new BoardTracker({ side: 'w' });
        const res = tr.update(frame(), W, H);
        n6++;
        const bw = Math.hypot(quad[1][0] - quad[0][0], quad[1][1] - quad[0][1]);
        const rel = quadError(res.quad, quad) / bw;
        let ori = false;
        if (res.H) {
          const desc = describeBoard(res.prepared, W, H, res.H);
          const mean = (i) => { let s = 0; for (let k = 0; k < 9; k++) s += desc[i * 9 + k]; return s / 9; };
          ori = mean(0) < mean(7);
        }
        if (res.quad && rel < 0.06 && ori) ok6++;
        else fails6.push(`${(size * 100) | 0}% r${(rot * 57.3) | 0}° @${px.toFixed(0)},${py.toFixed(0)}`
          + (res.quad ? ` err=${(rel * 100).toFixed(1)}%${ori ? '' : ' ORIENTATION'}` : ' no lock'));
      }
    }
  }
  log(`  board anywhere: ${ok6}/${n6} found in place with the right orientation`);
  for (const f of fails6.slice(0, 5)) log(`   ${f}`);
}

/* ------------------------------------------------------------------ */
/* 7. the recommendation loop                                          */
/* ------------------------------------------------------------------ */
log('\n=== 7. recommendation loop ===');
{
  let ok7 = 0, n7 = 0;
  const check = (name, cond, extra = '') => {
    n7++;
    if (cond) ok7++;
    log(`  ${name}: ${cond ? 'ok' : 'FAIL'}${extra ? ` (${extra})` : ''}`);
  };

  /**
   * A fresh camera + physical board + app state, locked on the synthetic scene.
   * `phys` is the board on the table; `coach.game` is what the camera has read.
   */
  function rig(side = 'w', flip = false, fen = null) {
    const quad = makePose(W, H, { tilt: 0.26, size: Math.min(W, H) * 0.8, flip });
    const r = {
      side,
      quad,
      phys: new Chess(fen || undefined),
      tracker: new BoardTracker({ side }),
      sampler: new BoardSampler(),
      reader: new MoveReader(),
      coach: new Coach(new Chess(fen || undefined), { side }),
      req: null,
    };
    r.shot = (occ = null) => renderScene(ctx, {
      w: W, h: H, fen: r.phys.fen(), quad, border: 0.02, light: 0.04,
      noise: 9, seed: 77, occluders: occ,
    });
    // the page's engine, replaced by a chosen answer so the test is repeatable
    r.think = () => { r.req = r.coach.request(); return r.req; };
    r.answer = (san) => {
      if (!r.req) return null;
      const g = new Chess();
      g.load(r.req.fen);
      const legal = g.moves({ verbose: true });
      const mv = legal.find((m) => m.san === san) || legal[0];
      if (!mv) { r.req = null; return null; }
      const okBest = r.coach.best(r.req.id, {
        fen: r.req.fen, from: mv.from, to: mv.to, san: mv.san, score: 12, depth: 3,
      });
      r.req = null;
      return okBest ? mv : null;
    };
    // the app's per-frame path: track, sample, and read a settled change
    r.pump = (n = 8, occ = null) => {
      let out = { r: null, read: null };
      for (let i = 0; i < n; i++) {
        r.shot(occ);
        const res = r.tracker.update(frame(), W, H);
        if (!res.H) { out = { r: null, read: null }; continue; }
        const { r: rr, desc } = sample(res, r.sampler, r.reader);
        out = { r: rr, read: null };
        if (rr.settled || rr.stuck) {
          out.read = r.coach.read(rr.changed);
          r.reader.commit(desc);
          break;
        }
      }
      return out;
    };
    r.shot();
    const res = r.tracker.update(frame(), W, H);
    r.locked = !!res.H;
    if (r.locked) r.reader.commit(r.sampler.see(res.prepared, W, H, res));
    return r;
  }

  const ownPlayed = (p) => !!(p.read && p.read.accepted && p.read.played);

  // 7a. the reported bug: play the recommended move, the arrow must go
  {
    const r = rig('w');
    check('locked', r.locked);
    r.think();
    check('asks the engine on our turn', !!r.req);
    r.answer('e4');
    const g = r.coach.guidance;
    check('arrow for our move', !!g && g.san === 'e4', g && g.san);

    r.phys.move('e4');
    const p = r.pump(8);
    check('our move read', !!(p.read && p.read.accepted),
      p.read ? (p.read.accepted ? 'accepted' : 'unreadable') : 'no settle');
    check('our move verified against the suggestion', ownPlayed(p));
    check('arrow dropped in the same read',
      r.coach.suggestion === null && r.coach.guidance === null);
    check('turn passed to the opponent', !r.coach.myTurn);

    r.pump(5);
    check('no arrow comes back while the opponent is to move', r.coach.guidance === null);
  }

  // 7b. a whole sequence: opponent move -> suggestion -> our move -> next
  {
    const r = rig('w');
    r.think();
    const e4 = r.answer('e4');
    r.phys.move({ from: e4.from, to: e4.to });
    r.pump(8);

    const line = [['c5', 'Nf3'], ['d6', 'd4'], ['cxd4', 'Nxd4'], ['Nf6', 'Nc3'], ['a6', 'Be2']];
    let reads = 0, verified = 0, cleared = 1;
    for (const [opp, own] of line) {
      r.phys.move(opp);
      const p = r.pump(8);
      if (p.read && p.read.accepted && !p.read.played) reads++;
      r.think();
      const mv = r.answer(own);
      const g = r.coach.guidance;
      if (!mv || !g) continue;
      r.phys.move({ from: g.from, to: g.to });
      const q = r.pump(8);
      if (ownPlayed(q)) verified++;
      if (r.coach.suggestion === null) cleared++;
    }
    check('opponent moves read', reads === 5, `${reads}/5`);
    check('our moves verified', verified === 5, `${verified}/5`);
    check('arrow cleared after each of our moves', cleared === 6, `${cleared}/6`);
    check('nothing left over after the last move',
      r.coach.suggestion === null && !r.coach.myTurn);
  }

  // 7c. playing something other than the arrow also clears it
  {
    const r = rig('w');
    r.think();
    r.answer('d4');
    const g = r.coach.guidance;
    check('arrow for d4', !!g && g.san === 'd4', g && g.san);
    const other = r.coach.game.moves({ verbose: true })
      .find((m) => m.from !== g.from || m.to !== g.to);
    r.phys.move(other);
    const p = r.pump(8);
    check('a different move is read', !!(p.read && p.read.accepted && !p.read.played));
    check('a different move clears the arrow', r.coach.suggestion === null);
    check('the game follows the physical board',
      r.coach.game.history().slice(-1)[0] === other.san);
  }

  // 7d. a hand over the board: hold the arrow, then clear it once the move
  //     played underneath the hand is confirmed
  {
    const r = rig('w');
    r.think();
    const mv = r.answer('e4');
    check('arrow before the hand', !!r.coach.guidance);
    // the same hand that parks on a corner in section 4c, well away from e2/e4
    const HAND7 = { pts: [[-0.4, 5.6], [1.6, 6.2], [2.2, 7.4]], width: 2.4 };
    r.pump(3, [HAND7]);
    check('arrow survives a hand on the board', !!r.coach.guidance);
    r.phys.move({ from: mv.from, to: mv.to });
    r.pump(3, [HAND7]);
    check('arrow held while the move is hidden', !!r.coach.guidance);
    const p = r.pump(10);
    check('move under the hand is verified when the view clears', ownPlayed(p));
    check('arrow cleared once the move is confirmed', r.coach.suggestion === null);
  }

  // 7e. a change no legal move explains: clear the arrow and do not ask again
  {
    const r = rig('w');
    r.think();
    r.answer('Nf3');
    check('arrow before the bad change', !!r.coach.guidance);
    // Move a *black* pawn by hand while it is White's move: the board on the
    // table no longer matches the game, which is what a misread leaves behind.
    const g = new Chess();
    g.load(r.phys.fen());
    const pawn = g.get('b7');
    g.remove('b7');
    g.remove('b6');
    g.put(pawn, 'b6');
    r.phys = g;
    const p = r.pump(8);
    check('not treated as a legal move', !!(p.read && !p.read.accepted));
    check('unreadable change clears the arrow',
      r.coach.suggestion === null && r.coach.guidance === null);
    check('no new request for the same broken position', r.req === null);
    r.pump(8);
    check('no arrow reappears on the following frames', r.coach.suggestion === null);
  }

  // 7f. the same loop with the player on Black: the board is seen from the
  //     other side, so the whole grid is rotated in the frame
  {
    const r = rig('b', true);
    check('locked from the other side', r.locked);
    r.think();
    check('no suggestion while the opponent is to move',
      r.req === null && r.coach.guidance === null);

    r.phys.move('e4');
    const p = r.pump(8);
    check('opponent move read from the other side',
      !!(p.read && p.read.accepted && !p.read.played));
    r.think();
    r.answer('e5');
    const g = r.coach.guidance;
    check('arrow for Black', !!g && g.san === 'e5', g && g.san);
    r.phys.move({ from: g.from, to: g.to });
    const q = r.pump(8);
    check('Black move verified', ownPlayed(q));
    check('Black arrow cleared', r.coach.suggestion === null);
  }

  // 7g. the exact complaint: a king move is recommended, the king is moved,
  //     and the arrow must go — including castling, which changes four squares
  {
    const r = rig('w', false, '4k3/8/8/8/8/8/4P3/4K3 w - - 0 1');
    check('locked (king endgame)', r.locked);
    r.think();
    r.answer('Kf1');
    const g = r.coach.guidance;
    check('arrow for the king move', !!g && g.san === 'Kf1', g && g.san);
    r.phys.move('Kf1');
    const p = r.pump(8);
    check('king move read as the suggestion', ownPlayed(p));
    check('king arrow cleared', r.coach.suggestion === null);
  }
  {
    const r = rig('w', false, 'r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1');
    r.think();
    const mv = r.answer('O-O');
    check('arrow for castling', !!mv && r.coach.guidance && r.coach.guidance.san === 'O-O');
    r.phys.move(mv);
    const p = r.pump(8);
    check('castling read as the suggestion', ownPlayed(p));
    check('castling arrow cleared', r.coach.suggestion === null);
  }

  log(`  recommendation loop: ${ok7}/${n7}`);
  window.__rec = { ok: ok7, total: n7 };
}

log('\ndone');
window.__done = true;
window.__summary = {
  detection: `${ok}/${total}`,
  moveRead: `${pass}/${moves.length}`,
  falseLocks,
  rec: window.__rec ? `${window.__rec.ok}/${window.__rec.total}` : '-',
};
</script>
</body>
</html>
