<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>AR Chess</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b0e12; color: #e8ecf1;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
  #hud {
    position: fixed; inset: auto 0 0 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(4,6,9,.92), rgba(4,6,9,.55) 65%, transparent);
    display: flex; flex-direction: column; gap: 8px;
  }
  #status {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: .01em;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #f0b429; flex: none; }
  #dot.ok { background: #35d07f; }
  #dot.bad { background: #ef5b5b; }
  #statusText { flex: 1 1 auto; min-width: 0; }
  #best {
    font: 600 15px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #6fe3a6; min-height: 18px;
  }
  #bar { display: flex; gap: 8px; align-items: stretch; }
  button, select {
    font: inherit; color: #e8ecf1; background: #1b232c;
    border: 1px solid #2c3946; border-radius: 10px; padding: 9px 12px;
    min-height: 40px; touch-action: manipulation;
  }
  button:active { background: #26323d; }
  button.primary { background: #1f6f4a; border-color: #2b8f61; }
  button:disabled { opacity: .45; }
  #side { flex: 0 0 auto; }
  #hint {
    position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top));
    padding: 10px 12px; border-radius: 12px;
    background: rgba(10,14,19,.82); border: 1px solid #24303c;
    font-size: 12.5px; color: #b9c4d0; display: none;
  }
  #hint b { color: #e8ecf1; }
  #hint.show { display: block; }
  #title {
    position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top));
    font: 600 12px/1 ui-monospace, monospace; letter-spacing: .14em;
    color: #6b7a8a; text-transform: uppercase;
  }
  #title.show { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="title">AR CHESS</div>

<div id="hint">
  <b>Point the camera at a chessboard.</b> Detection is automatic — no calibration.
  The outline follows the board as you move.<br>
  <span id="hintExtra"></span>
</div>

<div id="hud">
  <div id="best"></div>
  <div id="status"><span id="dot"></span><span id="statusText">Starting camera…</span></div>
  <div id="bar">
    <select id="side" aria-label="Your side">
      <option value="w" selected>I play White</option>
      <option value="b">I play Black</option>
    </select>
    <button id="resync" class="primary">Resync</button>
    <button id="undo">Undo</button>
    <button id="info" aria-label="Help">?</button>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
